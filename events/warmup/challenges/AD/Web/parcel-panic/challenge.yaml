name: "Parcel Panic"
author: "TCP1P"
description: |
  Parcel Panic is a self-hosted Attack & Defense warmup. Deploy the supplied
  service through the rsctf BYOC setup, keep its depot and vault available, and
  recover rotating flags from opposing depots before they close the route.

  The dispatch API accepts `GET /parcel?name=manifest.txt`. Your relay keeps
  the current round flag in the shared BYOC volume.
type: AttackDefense
category: Web
disableBloodBonus: true

container:
  # Repository Bindings builds ./src and makes that immutable image available
  # through the authenticated BYOC setup flow.
  exposePort: 8080

ad:
  # The team runs this image on its own host. The generated BYOC configuration
  # overrides RSCTF_FLAG_FILE with the relay-managed /shared/flag path.
  selfHosted: true
