# Draft Control is a shared marker-based KotH warmup challenge.
name: "Draft Control"
author: "dimasma0305"
description: |
  The publishing desk accepts edits only for drafts that already exist. Inspect
  its public API, then use your current KotH token to take control of the marker
  at `/koth/king`.

  Start with `GET /api/info`. A successful save only changes the target; rsctf
  attributes control on its next scoring tick.
type: KingOfTheHill
category: Web
disableBloodBonus: true

container:
  memoryLimit: 64
  cpuCount: 1
  exposePort: 8080

ad:
  # The marker service has no outbound dependency. Keep general Internet
  # egress disabled so this competitive hill is safe on Docker.
  allowEgress: false
