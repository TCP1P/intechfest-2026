# Serpent Circuit is a shared multiplayer, managed-reporting Leaderboard KotH game.
name: "Serpent Circuit"
author: "TCP1P"
description: |
  Create a private Snakes & Ladders room or join one with its six-character
  code. Two to four authenticated teams share the same live board and take
  turns rolling a server-generated die. Climb ladders, slide down snakes, roll
  exactly onto square 100, and remember that a six grants another turn.

  Authenticate each seat with its current KotH capability. Expired turns are
  rolled automatically after 30 seconds, so every match keeps moving. When a
  match finishes, the managed server reports each team's bounded
  `board-progress` ratio for that scoring wave. The sole greatest positive
  result earns the Crown; an exact tie earns no Crown. The game retains only
  authenticated capability hashes and never reports platform points or raw
  capabilities.
type: KingOfTheHill
category: PPC
disableBloodBonus: true

container:
  memoryLimit: 128
  cpuCount: 1
  exposePort: 8080

ad:
  # Managed challenge targets can reach the Internet by repository policy.
  allowEgress: true
