# Serpent Circuit is a shared multiplayer, managed-reporting Leaderboard KotH game.
name: "Serpent Circuit"
author: "TCP1P"
description: |
  Create a private Snakes & Ladders room or join one with its six-character
  code. Two to four authenticated teams share the same live board and take
  turns rolling a server-generated die. Climb ladders, slide down snakes, roll
  exactly onto square 100, and remember that a six grants another turn.

  If nobody else joins, the host can add one server-controlled Circuit Bot and
  play immediately. NPC rooms are clearly marked practice-only and never
  report Leaderboard evidence; play against authenticated human teams for a
  scored match.

  Authenticate each human seat with its current KotH capability. Expired human
  turns are rolled automatically after 30 seconds, so every match keeps
  moving. During a human-only match, every completed 60-second scoring tick
  reports each team's furthest server-confirmed square held during that tick as
  a bounded `board-progress` ratio. The sole greatest positive result earns the
  Crown; an exact tie earns no Crown. Finished, lobby, and NPC rooms do not
  carry progress into later ticks. The game retains only authenticated
  capability hashes and never reports platform points or raw capabilities.
type: KingOfTheHill
category: PPC
disableBloodBonus: true

container:
  memoryLimit: 128
  cpuCount: 1
  exposePort: 8080

ad:
  # Managed challenge targets can reach the Internet by repository policy.
  allowEgress: true
