# Tower of Babel is a shared, managed-reporting shellcode KotH arena.
name: "Tower of Babel"
author: "m3rr"
description: |
  Join the current hill with your rsctf KotH capability. Open the supplied
  terminal lobby or use TCP directly to inspect a randomized four-stage relay:
  x86-64, AArch64, RISC-V 64, and big-endian MIPS64. Each stage reads its
  secret and passes the next stage as hex through `execve`.

  PRTS archive, Year 1094, Kazdel: Doctor, Kal'tsit, Theresa, and Civilight
  Eterna guard Babel's four paths. Their order changes every wave.

  Each 60-second wave ranks stage depth, then outer payload size. The first
  team to authenticate all four stages may submit three patches per wave.
  Each patch is replay-tested: rejection keeps the previous ward, while
  acceptance applies to later attempts and future waves.
type: KingOfTheHill
category: Pwn
disableBloodBonus: true

provide: dist/tower-of-babel.zip

container:
  memoryLimit: 512
  cpuCount: 2
  storageLimit: 512
  exposePort: 1094

ad:
  # The managed target needs the private rsctf callback and normal event egress.
  allowEgress: true
