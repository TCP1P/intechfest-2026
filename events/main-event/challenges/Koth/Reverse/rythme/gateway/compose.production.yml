services:
  gateway:
    image: "${RYTHME_GATEWAY_IMAGE:?immutable Rythme gateway image is required}"
    container_name: rsctf-rythme-gateway
    restart: unless-stopped
    user: "65533:65533"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RYTHME_UPSTREAM: "http://${RYTHME_UPSTREAM:?active Rythme target is required}:1337"
      RYTHME_TARGET_ID: "${RYTHME_TARGET_ID:?active Rythme target identity is required}"
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 8s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
    networks:
      - ad
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
      traefik.http.routers.rythme-private.rule: "Host(`${RYTHME_HOSTNAME:-rythme-private.tcp.1pc.tf}`)"
      traefik.http.routers.rythme-private.entrypoints: websecure
      traefik.http.routers.rythme-private.tls.certresolver: letsencrypt
      traefik.http.routers.rythme-private.service: rythme-private
      traefik.http.services.rythme-private.loadbalancer.server.port: "8080"
      traefik.http.services.rythme-private.loadbalancer.healthcheck.path: /gateway/healthz
      traefik.http.services.rythme-private.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.rythme-private.loadbalancer.healthcheck.timeout: 2s

networks:
  ad:
    external: true
    name: "${RSCTF_AD_NETWORK:-rsctf-ad}"
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
