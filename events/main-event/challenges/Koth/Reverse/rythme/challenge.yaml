# Rythme is a shared, managed-reporting Leaderboard KotH arena.
name: "Rythme"
author: "dimasma0305"
description: |
  Rythme is Syncore's live Crown qualifier. Every crew receives the same
  surprise track, discipline, and synchronized start. Download the supplied
  client, complete a fresh server-timed heat, and take the recurring Crown
  before the current owner locks in another payout.
type: KingOfTheHill
category: Reverse
disableBloodBonus: true
provide: dist/reversing_rythme.zip

container:
  # Repository Bindings builds the coordinator from src/Dockerfile. The stable
  # player-facing HTTPS origin is operated separately from gateway/.
  memoryLimit: 512
  cpuCount: 2
  exposePort: 1337

ad:
  # Players fetch the pinned public beatmaps directly. rsctf grants only the
  # managed scoring callback route to the coordinator.
  allowEgress: false
