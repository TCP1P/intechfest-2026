# Rythme is a shared, managed-reporting Leaderboard KotH arena.
name: "Rythme"
author: "dimasma0305"
description: |
  Rythme is Syncore's live Crown qualifier. Every crew receives the same
  surprise track, discipline, and synchronized start. Download the supplied
  client, connect the event VPN, enter the current private target shown by
  RSCTF, complete a fresh server-timed heat, and take the recurring Crown.
type: KingOfTheHill
category: Reverse
disableBloodBonus: true
provide: dist/reversing_rythme.zip

container:
  # Repository Bindings builds the coordinator from src/Dockerfile. Players
  # reach this declared TCP port directly through the event VPN.
  memoryLimit: 512
  cpuCount: 2
  exposePort: 1337

ad:
  # Beatmaps are pinned into the image; only rsctf's private reporting callback
  # is needed at runtime.
  allowEgress: false
