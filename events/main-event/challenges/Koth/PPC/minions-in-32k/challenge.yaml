# Minions in 32K is a shared, managed-reporting Leaderboard KotH arena.
name: "Minions in 32K"
author: "Project Sekai CTF contributors and dimasma0305"
description: |
  Fight for control of Gru's Lab in an objective-aware arena rendered at
  exactly 32,768 internal pixels. Download the client, reverse protocol v13,
  automate combat and confirmation routing, and sustain the best confirmed
  performance across the arena.
type: KingOfTheHill
category: PPC
disableBloodBonus: true
provide: dist/game_minions-in-32k.zip

container:
  # Repository Bindings builds the shared arena from src/Dockerfile. The
  # player-facing UDP relay is operated separately from gateway/.
  memoryLimit: 512
  cpuCount: 2
  exposePort: 8080

ad:
  # rsctf grants the managed target only its narrow scoring callback route.
  allowEgress: false
