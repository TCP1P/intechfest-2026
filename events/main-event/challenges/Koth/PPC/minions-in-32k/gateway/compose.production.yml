services:
  gateway:
    image: "${MINIONS_GATEWAY_IMAGE:?immutable Minions gateway image is required}"
    container_name: rsctf-minions-gateway
    restart: unless-stopped
    user: "32033:32033"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MINIONS_UPSTREAM: "${MINIONS_UPSTREAM:?active Minions target is required}:4433"
      MINIONS_HEALTH_URL: "http://${MINIONS_UPSTREAM:?active Minions target is required}:8080/healthz"
      MINIONS_TARGET_ID: "${MINIONS_TARGET_ID:?active Minions target identity is required}"
      MINIONS_PUBLIC_REMOTE: "${MINIONS_PUBLIC_REMOTE:-tcp.1pc.tf:4532}"
      MINIONS_UDP_LISTEN: :4532
    ports:
      - "${MINIONS_UDP_PORT:-4532}:4532/udp"
    mem_limit: 128m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 8s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
    networks:
      - ad
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
      traefik.http.routers.minions-private.rule: "Host(`${MINIONS_HOSTNAME:-minions-private.tcp.1pc.tf}`)"
      traefik.http.routers.minions-private.entrypoints: websecure
      traefik.http.routers.minions-private.tls.certresolver: letsencrypt
      traefik.http.routers.minions-private.service: minions-private
      traefik.http.services.minions-private.loadbalancer.server.port: "8080"
      traefik.http.services.minions-private.loadbalancer.healthcheck.path: /gateway/healthz
      traefik.http.services.minions-private.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.minions-private.loadbalancer.healthcheck.timeout: 2s

networks:
  ad:
    external: true
    name: "${RSCTF_AD_NETWORK:-rsctf-ad}"
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
