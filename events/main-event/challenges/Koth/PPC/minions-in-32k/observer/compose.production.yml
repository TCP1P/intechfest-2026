services:
  bridge:
    image: "${MINIONS_BRIDGE_IMAGE:?immutable Minions bridge image is required}"
    container_name: rsctf-minions-bridge
    restart: unless-stopped
    user: "32033:32033"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RSCTF_GAME_ID: "${RSCTF_GAME_ID:?active Minions game is required}"
      RSCTF_CHALLENGE_ID: "${RSCTF_CHALLENGE_ID:?active Minions challenge is required}"
      RSCTF_URL: http://rsctf:8080
      MINIONS_UPSTREAM: "${MINIONS_UPSTREAM:?active Minions target is required}:4433"
      MINIONS_HEALTH_URL: "http://${MINIONS_UPSTREAM:?active Minions target is required}:8080/healthz"
      MINIONS_TARGET_ID: "${MINIONS_TARGET_ID:?active Minions target identity is required}"
      MINIONS_PUBLIC_REMOTE: "${MINIONS_PUBLIC_REMOTE:-tcp.1pc.tf:4532}"
      MINIONS_UDP_LISTEN: :4532
      MINIONS_SECRET_FILE: /run/secrets/bridge.json
      MINIONS_STATE_DIR: /var/lib/rsctf-minions
    ports:
      - "${MINIONS_UDP_PORT:-4532}:4532/udp"
    volumes:
      - type: volume
        source: bridge-secret
        target: /run/secrets
        read_only: true
      - type: volume
        source: bridge-state
        target: /var/lib/rsctf-minions
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 8s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/bridge", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
    networks:
      - ad
      - rsctf
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
      traefik.http.routers.minions-private.rule: "Host(`${MINIONS_HOSTNAME:-minions-private.tcp.1pc.tf}`)"
      traefik.http.routers.minions-private.entrypoints: websecure
      traefik.http.routers.minions-private.tls.certresolver: letsencrypt
      traefik.http.routers.minions-private.service: minions-private
      traefik.http.services.minions-private.loadbalancer.server.port: "8080"
      traefik.http.services.minions-private.loadbalancer.healthcheck.path: /bridge/healthz
      traefik.http.services.minions-private.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.minions-private.loadbalancer.healthcheck.timeout: 2s

volumes:
  bridge-secret:
    external: true
    name: "${MINIONS_BRIDGE_SECRET_VOLUME:-rsctf-minions-bridge-secret}"
  bridge-state:
    external: true
    name: "${MINIONS_BRIDGE_STATE_VOLUME:-rsctf-minions-bridge-state}"

networks:
  ad:
    external: true
    name: "${RSCTF_AD_NETWORK:-rsctf-ad}"
  rsctf:
    external: true
    name: "${RSCTF_NETWORK:-rsctf_default}"
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
