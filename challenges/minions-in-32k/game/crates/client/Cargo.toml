[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol = { path = "../protocol" }
common = { path = "../common" }
sim = { path = "../sim" }
glam = { workspace = true }
serde = { workspace = true }
toml = "0.8"
bevy = { workspace = true, features = ["webgl2"] }
anyhow = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
bevy_embedded_assets = "0.11"
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
arboard = { version = "3", default-features = false }
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window", "Location", "UrlSearchParams", "Document", "Element",
    "WebTransport", "WebTransportOptions", "WebTransportHash",
    "WebTransportBidirectionalStream", "WebTransportDatagramDuplexStream",
    "ReadableStream", "ReadableStreamDefaultReader",
    "WritableStream", "WritableStreamDefaultWriter",
] }
