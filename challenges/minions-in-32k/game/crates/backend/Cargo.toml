[package]
name = "backend"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
axum = "0.7"
base64 = "0.22.1"
clap = { workspace = true, features = ["env"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
kube = { version = "3.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
object_store = { version = "0.14", default-features = false, features = ["gcp"] }
pem = "3"
rand = "0.8"
rcgen.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17.14"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { workspace = true }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
