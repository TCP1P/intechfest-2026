[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_state",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_sprite",
    "bevy_asset",
    "bevy_scene",
    "bevy_gltf",
    "bevy_animation",
    # Bevy's `animation` umbrella also enables bevy_gltf/bevy_animation,
    # without which the glTF loader silently drops all AnimationClips.
    "animation",
    "bevy_ui",
    "bevy_text",
    "default_font",  # without this TextBundle has no font and renders nothing
    "bevy_gizmos",
    "bevy_audio",
    "wav",
    "vorbis",
    "x11",
    "tonemapping_luts",
    "ktx2",
    "zstd",
] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
glam = "0.27"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
